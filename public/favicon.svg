<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#7c3aed"/>
  <!-- mic body -->
  <rect x="11" y="3" width="10" height="15" rx="5" fill="white"/>
  <!-- mic arc / stand arm -->
  <path d="M6 16a10 10 0 0 0 20 0" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- stand pole -->
  <line x1="16" y1="26" x2="16" y2="29.5" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- stand base -->
  <line x1="11" y1="29.5" x2="21" y2="29.5" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- mic grille lines (subtle) -->
  <line x1="11" y1="10" x2="21" y2="10" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
  <line x1="11" y1="13" x2="21" y2="13" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
</svg>
